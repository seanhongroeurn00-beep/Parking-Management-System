<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Parking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Khmer&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Siemreap', sans-serif; }
        .font-moul { font-family: 'Moul', cursive; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border border-slate-700/30">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold font-moul text-slate-800">ចូលប្រើប្រាស់ប្រព័ន្ធ</h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Parking Management System</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                <input type="text" id="username" value="admin" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 font-semibold">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">លេខសម្ងាត់ (Password)</label>
                <input type="password" id="password" value="123456" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 font-semibold">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-md mt-2">
                🔑 ចូលប្រព័ន្ធ (Login)
            </button>
        </form>
    </div>

    <script>
        const API_URL = '/api/parking';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('admin_logged', 'true');
                    localStorage.setItem('admin_name', data.admin ? data.admin.full_name : 'User');
                    localStorage.setItem('admin_role', data.admin && data.admin.role ? data.admin.role.toLowerCase() : 'cashier');

                    // ផ្លាស់ទៅទំព័រដើម
                    window.location.href = 'index.html';
                } else {
                    alert('⚠️ Login មិនជោគជ័យ៖ ' + (data.message || 'Username ឬ Password មិនត្រឹមត្រូវ!'));
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert('❌ មិនអាចភ្ជាប់ទៅកាន់ Backend Server (/api) បានទេ! សូមពិនិត្យ IP របស់ Backend។');
            }
        });
    </script>
</body>
</html>
